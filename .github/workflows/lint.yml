name: Lint

on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - '**/*.py'
      - '**/*.js'
      - '**/*.html'
      - 'requirements/**'
      - 'pyproject.toml'
      - 'package.json'
      - 'package-lock.json'
      - '.prettierrc'
      - '.github/workflows/lint.yml'

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install uv dependencies
        run: |
          # Try the official installer first, fallback to pip if needed
          if curl -LsSf https://astral.sh/uv/install.sh | sh; then
            source $HOME/.cargo/env
          else
            echo "Installing uv via pip as fallback..."
            python -m pip install --upgrade pip
            python -m pip install uv
          fi
          uv pip install --system --break-system-packages -r requirements/base.txt -r requirements/test.txt

      - name: Run ruff linting
        run: |
          python -m ruff check

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: 'npm'

      - name: Install npm dependencies (prettier)
        run: npm ci

      # --check, not --write: `make prettier_lint` rewrites files locally, which in CI would
      # silently pass on a tree that is not formatted. Same file set as the makefile's.
      - name: Check prettier formatting
        run: git ls-files -z '*.html' '*.js' | xargs -0 npx prettier --check
